name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyCCgUTl2uibsItFKeUR8S1FdWnkCw69Jtw"
          VITE_FIREBASE_AUTH_DOMAIN: "billsplit-ai-app.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "billsplit-ai-app"
          VITE_FIREBASE_STORAGE_BUCKET: "billsplit-ai-app.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "499666461851"
          VITE_FIREBASE_APP_ID: "1:499666461851:web:fdfd6943033f1adc27523e"
          VITE_GEMINI_API_KEY: "AQ.Ab8RN6IHE375osRsh9tpAgym3Q00rfctxZWXK3zezVSUp4VvtA"
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillSplit-AI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
